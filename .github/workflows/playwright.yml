# End-to-end tests (build-docs/E2E-HARDENING-PROMPT.md).
#
# Replaces the `npm init playwright` scaffold, which ran `npm ci` at a root
# that had no package.json and then executed the stock example spec against
# playwright.dev. It would have failed on every push while testing nothing in
# this repo.
#
# E2E here needs the WHOLE stack: MySQL, Redis, the FastAPI backend (migrated
# and seeded) and the Angular dev server. playwright.config.ts starts the two
# app servers itself; this workflow provides everything underneath them.
name: E2E

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root_dev_password
          MYSQL_DATABASE: meshrd_cms
          MYSQL_USER: meshrd
          MYSQL_PASSWORD: meshrd_dev_password
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h localhost -u root -proot_dev_password"
          --health-interval=5s --health-timeout=5s --health-retries=20
      redis:
        # Not optional: the login rate limiter talks to Redis, and every test
        # signs in. It fails open rather than erroring, but running without it
        # would mean the suite never exercises the real login path.
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd="redis-cli ping" --health-interval=5s
          --health-timeout=3s --health-retries=10

    env:
      DATABASE_URL: mysql+asyncmy://meshrd:meshrd_dev_password@127.0.0.1:3306/meshrd_cms
      DATABASE_URL_SYNC: mysql+pymysql://meshrd:meshrd_dev_password@127.0.0.1:3306/meshrd_cms
      REDIS_URL: redis://127.0.0.1:6379/0
      SECRET_KEY: ci-only-not-a-real-secret
      CREDENTIAL_ENCRYPTION_KEY: 8pO6nS8x4jL0kQeD3zC7vF1yB9tH2mR5wA6uN0iG4sE=
      ENVIRONMENT: ci

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install backend
        working-directory: backend
        run: pip install -e ".[dev]"

      - name: Migrate and seed
        working-directory: backend
        # Seed is required, not optional: the suite signs in as the five
        # seeded users and drives real screens. An unseeded database would
        # fail every test for the wrong reason.
        run: |
          alembic upgrade head
          python -m app.seed

      - name: Install frontend
        working-directory: frontend
        run: npm ci

      - name: Install E2E runner
        run: npm ci

      - name: Install browsers
        run: npx playwright install --with-deps

      # playwright.config.ts's webServer starts the Angular dev server and
      # uvicorn (no --reload, deliberately) and waits for both to answer.
      - name: Run E2E
        run: npx playwright test
        env:
          CI: "true"

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 30
