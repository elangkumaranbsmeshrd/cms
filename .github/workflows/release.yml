# Builds both images and publishes them to GHCR, tagged by commit SHA.
#
# This is the missing half of the deploy story: backend/scripts/deploy.sh pulls
# by IMAGE_TAG from a registry, and nothing was producing those images. Tagging
# by SHA (not by a moving :latest) is what makes a deploy reproducible and a
# rollback meaningful -- the artefact deployed is byte-identical to the one CI
# tested at that commit.
#
# Deliberately NOT auto-deploying. Publishing an image is safe and reversible;
# pushing it onto a live server holding real payroll data is not, and should
# stay a human decision until the deploy path has been exercised against real
# infrastructure at least once.
name: Release images

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          # Provided automatically by Actions; no PAT to manage or rotate.
          password: ${{ secrets.GITHUB_TOKEN }}

      # Lowercased because GHCR rejects uppercase in a repository path, and a
      # GitHub owner may legitimately contain capitals.
      - name: Compute image namespace
        id: ns
        run: echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: ghcr.io/${{ steps.ns.outputs.owner }}/cms-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: ghcr.io/${{ steps.ns.outputs.owner }}/cms-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy instructions
        run: |
          echo "Images published for commit ${{ github.sha }}."
          echo
          echo "To deploy, from a machine with SSH access to the server:"
          echo "  export DEPLOY_HOST=<server>"
          echo "  export IMAGE_OWNER=${{ steps.ns.outputs.owner }}"
          echo "  export IMAGE_TAG=${{ github.sha }}"
          echo "  backend/scripts/deploy.sh"
          echo
          echo "First deploy only: create /opt/meshrd-cms/shared/.env on the server"
          echo "from .env.prod.example before running the above."
